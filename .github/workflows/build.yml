name: Build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Test and build APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "Using Android SDK at $SDK"
          echo "sdk.dir=$SDK" > local.properties
          SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMGR" ] || SDKMGR="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -n 1)"
          [ -x "$SDKMGR" ] && yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          [ -x "$SDKMGR" ] && "$SDKMGR" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
          "$SDKMGR" --version || true

      - name: Test and build
        run: chmod +x gradlew && ./gradlew test assembleDebug assembleRelease --console=plain

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: OpenCodePair-apk
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
